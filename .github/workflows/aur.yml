# Publishes packaging/PKGBUILD to the AUR package `zomp-git`.
#
# The in-repo PKGBUILD is the source of truth; this job copies it verbatim, so
# the AUR entry can never drift from the repo. zomp-git is a VCS package:
# pkgver() runs on the builder's machine, so a sync that rewrites main needs no
# action here — this only fires when the packaging recipe itself changes.
#
# Requires an `AUR_SSH_KEY` secret: a DEDICATED key registered on the AUR
# account, never a shared infra/ansible key. Without it the job warns and
# skips, leaving the GitHub side untouched.
name: aur

on:
   push:
      branches: [main]
      paths:
         - "packaging/**"
         - ".github/workflows/aur.yml"
   workflow_dispatch:

permissions:
   contents: read

jobs:
   publish:
      runs-on: ubuntu-latest
      container: archlinux:base-devel
      steps:
         - name: Install tooling
           run: pacman -Sy --noconfirm --needed git openssh pacman-contrib

         - name: Checkout (for packaging/PKGBUILD)
           uses: actions/checkout@v4

         - name: Guard on AUR_SSH_KEY
           id: guard
           env:
              AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
           run: |
              if [ -z "${AUR_SSH_KEY:-}" ]; then
                echo "::warning::AUR_SSH_KEY not set — skipping AUR publish"
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi

         - name: Configure ssh (pinned host keys, no TOFU)
           if: steps.guard.outputs.skip == 'false'
           env:
              AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
           run: |
              set -euo pipefail
              # Absolute path, not ~/.ssh: ssh resolves ~ via getpwuid(), which
              # for the root step user is /root — but GitHub sets HOME=/github/home
              # for container steps, so ~/.ssh (bash) and ssh's ~ disagree. Writing
              # here and pointing GIT_SSH_COMMAND at it removes that mismatch.
              install -d -m 700 /tmp/aur-ssh
              # AUR host keys pinned from `ssh-keyscan aur.archlinux.org`.
              cat > /tmp/aur-ssh/known_hosts <<'EOF'
              aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
              aur.archlinux.org ssh-rsa 
              EOF
              chmod 600 /tmp/aur-ssh/known_hosts
              printf '%s\n' "$AUR_SSH_KEY" > /tmp/aur-ssh/key
              chmod 600 /tmp/aur-ssh/key

         - name: Build AUR commit and push
           if: steps.guard.outputs.skip == 'false'
           env:
              GIT_SSH_COMMAND: "ssh -i /tmp/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/aur-ssh/known_hosts -o StrictHostKeyChecking=yes"
           run: |
              set -euo pipefail

              # makepkg refuses to run as root — use an unprivileged user.
              useradd -m builder
              git config --global --add safe.directory '*'

              # First publish: the AUR repo does not exist until something is
              # pushed to it, so `git clone` fails exactly once.
              if ! git clone ssh://aur@aur.archlinux.org/zomp-git.git /tmp/aur 2>/dev/null; then
                echo "zomp-git does not exist yet — creating it"
                mkdir -p /tmp/aur
                git -C /tmp/aur init -q -b master
                git -C /tmp/aur remote add origin ssh://aur@aur.archlinux.org/zomp-git.git
              fi

              cp packaging/PKGBUILD /tmp/aur/PKGBUILD
              chown -R builder:builder /tmp/aur
              # .SRCINFO is generated from the PKGBUILD alone; a VCS package needs
              # no source checkout for it (pkgver() runs on the builder's machine).
              su builder -c 'cd /tmp/aur && makepkg --printsrcinfo > .SRCINFO'

              cd /tmp/aur
              git config user.name 'Rotko Networks'
              git config user.email 'hq@rotko.net'
              if git diff --quiet && git diff --cached --quiet && [ -n "$(git rev-parse --verify HEAD 2>/dev/null)" ]; then
                echo "AUR already up to date — nothing to push"
                exit 0
              fi
              git add -- PKGBUILD .SRCINFO
              git commit -qm "zomp-git: sync packaging recipe from $(echo "$GITHUB_SHA" | cut -c1-9)"
              git push origin master
